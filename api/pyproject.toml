[project]
name = "quiz-api"
version = "0.1.0"
description = "Real-time vocabulary quiz API."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "opentelemetry-api>=1.29",
    "prometheus-client>=0.21",
    "pydantic-settings>=2.7",
    "pyjwt>=2.10",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0",
    "sse-starlette>=2.2",
    "structlog>=24.4",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "ASYNC", # Async programming mistakes.
    "B",     # Likely bugs and design problems.
    "D",     # Public documentation.
    "E",     # Pycodestyle errors.
    "F",     # Pyflakes.
    "I",     # Import ordering.
    "RUF",   # Ruff-specific rules.
    "S",     # Security checks.
    "SIM",   # Simplifications that improve readability.
    "UP",    # Modern Python syntax.
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "locust>=2.32",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "testcontainers[postgres,redis]>=4.9",
]
